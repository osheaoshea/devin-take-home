services:
  postgres:
    image: postgres:16-alpine
    container_name: itp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: internal_tools
    ports:
      - '5432:5432'
    volumes:
      - itp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d internal_tools']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  itp-pgdata:
